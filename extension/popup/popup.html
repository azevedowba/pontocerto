<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Certo</title>
  <link rel="stylesheet" href="../../shared/css/style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <div class="popup-content">
      <header class="popup-header">
        <span class="eyebrow">SEU DIA, NO CONTROLE</span>
        <div class="popup-brand-line">
          <img class="popup-brand-mark" src="../../shared/assets/ponto-certo-mark.svg" alt="">
          <div class="popup-brand-copy">
            <h1>Ponto Certo</h1>
            <p>Gestor Inteligente de Jornada</p>
          </div>
        </div>
      </header>

      <section class="glass-card popup-card" aria-labelledby="punch-title">
        <div class="card-header punch-header">
          <div class="punch-heading">
            <div class="punch-heading-copy">
              <h2 id="punch-title">Batidas de ponto</h2>
              <p>Registre os horários do seu dia.</p>
            </div>
          </div>
          <div id="compliance-box" class="compliance-box hidden" role="status" aria-live="polite">
            <div id="compliance-status"></div>
            <ul id="compliance-messages"></ul>
          </div>
        </div>

        <div class="field-grid">
          <div class="field-group float-tile">
            <button type="button" class="tile-stamp" data-input-id="input-entrada-manha" aria-label="Registrar horário atual: Entrada manhã"></button>
            <label for="input-entrada-manha"><svg class="field-icon icon-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>Entrada manhã</label>
            <input type="time" id="input-entrada-manha" class="input-field">
          </div>
          <div class="field-group float-tile">
            <button type="button" class="tile-stamp" data-input-id="input-saida-almoco" aria-label="Registrar horário atual: Saída almoço"></button>
            <label for="input-saida-almoco"><svg class="field-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3v7m4-7v7m-8-4h8m-4 4v11M17 3v18m0-18c-3 2-4 5-4 9h4"/></svg>Saída almoço</label>
            <input type="time" id="input-saida-almoco" class="input-field">
          </div>
          <div class="field-group float-tile">
            <button type="button" class="tile-stamp" data-input-id="input-volta-almoco" aria-label="Registrar horário atual: Volta almoço"></button>
            <label for="input-volta-almoco"><svg class="field-icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V5h8v3M3 13h18m-11 0v2h4v-2"/></svg>Volta almoço</label>
            <input type="time" id="input-volta-almoco" class="input-field">
          </div>
          <div class="field-group float-tile tile-accent">
            <button type="button" class="tile-stamp" data-input-id="input-saida-tarde" aria-label="Registrar horário atual: Saída tarde"></button>
            <label for="input-saida-tarde"><svg class="field-icon icon-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v11h14V10m-9 11v-7h4v7"/></svg>Saída tarde</label>
            <input type="time" id="input-saida-tarde" placeholder="Automático" class="input-field input-accent">
          </div>
        </div>

        <div class="target-exit-suggestion" aria-live="polite">
          <span class="target-exit-label">Horário ideal de saída tarde</span>
          <strong id="target-exit-display">--:--</strong>
          <p id="target-exit-subtext">Para cumprir 08h 00m de trabalho líquido</p>
        </div>
      </section>

      <div class="action-row">
        <div class="glass-card summary-row" aria-label="Resumo da jornada">
          <div class="summary-stat">
            <span>TRABALHADO</span>
            <strong id="worked-time-text">00h 00m</strong>
          </div>
          <div class="summary-stat summary-stat-remaining">
            <span>FALTA</span>
            <strong id="remaining-time-text">08h 00m</strong>
          </div>
          <label class="summary-stat summary-stat-target" for="input-target-work-hours">
            <span>META</span>
            <input type="text" id="input-target-work-hours" value="08:00" class="input-small" aria-label="Meta diária configurada" readonly>
          </label>
          <div class="progress-track" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="progress-bar"></span>
          </div>
        </div>
        <div class="button-group">
          <button id="btn-salvar" type="button" class="btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h13l3 3v13H4zM8 4v6h8V4M8 20v-7h8v7"/></svg>Salvar Registro</button>
          <button id="btn-history" type="button" class="btn-secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M8 15h8"/></svg>Histórico</button>
          <button id="btn-export" type="button" class="btn-secondary btn-icon" title="Exportar histórico" aria-label="Exportar histórico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg></button>
          <button id="btn-limpar" type="button" class="btn-danger btn-icon" title="Limpar horários" aria-label="Limpar horários"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4m-8 3 1 14h10l1-14M10 11v6m4-6v6"/></svg></button>
          <button id="btn-settings-toggle" type="button" class="btn-secondary btn-icon" title="Configurar perfil de jornada" aria-label="Configurar perfil de jornada" aria-expanded="false" aria-controls="work-profile-panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1 0 1.7Z"/></svg></button>
        </div>
      </div>
      <section id="work-profile-panel" class="work-profile-panel hidden" aria-labelledby="work-profile-title">
        <h2 id="work-profile-title">Configurações do perfil</h2>
        <div id="work-profile-form-container"></div>
      </section>
    </div>
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="app_logic.js"></script>
</body>
</html>
