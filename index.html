    <script>
        // ... existing code ...

        function updateDevModeUI() {
            const devElements = document.querySelectorAll('.dev-mode-only');
            devElements.forEach(el => {
                if (isDevMode) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            const lockIcon = document.getElementById('lock-icon');
            if (lockIcon) {
                if (isDevMode) {
                    lockIcon.className = "fa-solid fa-lock-open text-emerald-400";
                } else {
                    lockIcon.className = "fa-solid fa-lock text-slate-400";
                }
            }

            // Se DevMode desativado e estiver em aba restrita, volta para 'today'
            if (!isDevMode && (currentTab === 'vpn' || currentTab === 'roadmap')) {
                switchTab('today');
            }
        }

        function switchTab(tab) {
            // Trava de segurança: se não for dev e tentar acessar aba restrita
            if (!isDevMode && (tab === 'vpn' || tab === 'roadmap')) {
                showToast("Acesso restrito ao Modo Criador.");
                tab = 'today';
            }

            currentTab = tab;

            // Esconde todas as seções de conteúdo
            document.querySelectorAll('.tab-content').forEach(section => {
                section.classList.add('hidden');
            });

            // Exibe a seção ativa
            const activeSection = document.getElementById(`tab-${tab}`);
            if (activeSection) {
                activeSection.classList.remove('hidden');
            }

            // Atualiza os estilos dos botões ativos e inativos
            const tabButtons = {
                'today': 'tab-today-btn',
                'history': 'tab-history-btn',
                'vpn': 'tab-vpn-btn',
                'roadmap': 'tab-roadmap-btn'
            };

            Object.keys(tabButtons).forEach(t => {
                const btn = document.getElementById(tabButtons[t]);
                if (btn) {
                    if (t === tab) {
                        btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-500/25');
                        btn.classList.remove('text-slate-400', 'hover:text-white');
                    } else {
                        btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-500/25');
                        btn.classList.add('text-slate-400', 'hover:text-white');
                    }
                }
            });

            // Re-aplica a regra de visibilidade do DevMode para garantir que botões ocultos continuem ocultos
            updateDevModeUI();

            if (tab === 'history') {
                renderHistory();
            }
        }

        // ... existing code ...
    </script>
